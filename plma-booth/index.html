<title>PLMA Booth Copilot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..900&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first single column (max 760px), sticky top bar, fixed bottom tabs.
   Supplier specs are set like a food Nutrition Facts panel ("Facility Facts"); founding sign-ups render as a grocery shelf tag. */
:root{
  --bg:#EDF1EC; --surface:#FFFFFF; --surface-2:#F5F7F4; --ink:#13241D; --muted:#566760; --line:#D2DBD4;
  --accent:#1E4A3A; --on-accent:#FFFFFF; --band:#1E4A3A; --on-band:#FFFFFF; --tag:#F6C945; --tag-ink:#2B2200;
  --ok:#1A7347; --ok-bg:#E1F1E8; --warn:#8F5400; --warn-bg:#FAEED6; --bad:#B0251C; --bad-bg:#FAE4E1; --info:#22507A; --info-bg:#E3EDF7;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:12px; --tabh:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B130F; --surface:#13201A; --surface-2:#182720; --ink:#E3EDE7; --muted:#95A79D; --line:#29392F;
  --accent:#86CDA9; --on-accent:#0B130F; --band:#163C2E; --on-band:#E9F4EE; --tag:#F6C945; --tag-ink:#2B2200;
  --ok:#6FD39E; --ok-bg:#14301F; --warn:#F2B24C; --warn-bg:#33260E; --bad:#FF8F85; --bad-bg:#3A1916; --info:#8CC2F0; --info-bg:#132639;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B130F; --surface:#13201A; --surface-2:#182720; --ink:#E3EDE7; --muted:#95A79D; --line:#29392F;
  --accent:#86CDA9; --on-accent:#0B130F; --band:#163C2E; --on-band:#E9F4EE; --tag:#F6C945; --tag-ink:#2B2200;
  --ok:#6FD39E; --ok-bg:#14301F; --warn:#F2B24C; --warn-bg:#33260E; --bad:#FF8F85; --bad-bg:#3A1916; --info:#8CC2F0; --info-bg:#132639;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--band)}
h1,h2,h3,h4{font-family:var(--f-display);font-stretch:85%;margin:0;text-wrap:balance;letter-spacing:-.005em}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
.mono{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.02em}
.muted{color:var(--muted)}
.fine{font-size:.8rem;color:var(--muted);margin:0}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;opacity:0}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--band);color:var(--on-band)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand h1{font-size:1.3rem;font-weight:800;font-stretch:80%;white-space:nowrap}
.shelf{display:inline-flex;align-items:center;gap:6px;background:var(--tag);color:var(--tag-ink);font-family:var(--f-mono);font-weight:600;font-size:.72rem;padding:3px 8px 3px 6px;border-radius:3px;letter-spacing:.04em}
.shelf::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--band)}
.top-stats{font-family:var(--f-mono);font-size:.75rem;opacity:.9;text-align:right;white-space:nowrap}

/* Banner + toast */
.banner{margin-top:12px;padding:10px 12px;border-radius:var(--r);background:var(--warn-bg);color:var(--warn);font-size:.88rem}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 12px);z-index:40;max-width:min(92vw,520px);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:.88rem;box-shadow:0 6px 24px rgba(0,0,0,.25)}

/* Main */
main{padding-block:14px calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 28px)}
.stack{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.panel-h h2{font-size:1.35rem;font-weight:800}
.hint{margin:0;font-size:.88rem;color:var(--muted)}
.hint q{color:var(--ink);font-style:italic}

/* Buttons */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;min-height:42px}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,.shot:focus-within,.chip:focus-visible,summary:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.big{min-height:54px;font-size:1.05rem;width:100%}
.btn.sm{min-height:36px;padding:7px 11px;font-size:.85rem}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.confirm{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.acts{display:flex;flex-wrap:wrap;gap:8px}

/* Forms */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
label,.lbl{font-size:.78rem;font-weight:600;color:var(--muted);letter-spacing:.02em}
input[type=text],input[type=email],input[type=tel],input[type=url],input[type=date],textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:10px 11px;min-height:44px}
textarea{resize:vertical;line-height:1.45}
.check{display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--ink);font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.inrow{display:flex;gap:8px}
.inrow input{flex:1;min-width:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.86rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

/* Capture tiles */
.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.shot{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:118px;max-width:100%;border:1.5px dashed var(--line);border-radius:var(--r);background:var(--surface-2);cursor:pointer;text-align:center;padding:8px;overflow:hidden;font-weight:600;font-size:.84rem;color:var(--ink)}
.shot svg{width:28px;height:28px;flex:none;color:var(--accent)}
.shot small{font-weight:500;color:var(--muted);font-size:.72rem;line-height:1.25}
.shot.has{border-style:solid;border-color:var(--accent);padding:0}
.shot.has img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot .badge{position:absolute;left:6px;right:6px;bottom:6px;background:rgba(10,20,15,.78);color:#fff;border-radius:7px;padding:3px 6px;font-size:.7rem;font-weight:600}
.shot.tagged{background:var(--tag);color:var(--tag-ink);border:none}
.shot.tagged small{color:var(--tag-ink)}
.shot.tagged svg{color:var(--tag-ink)}

/* Fireflies panel */
.ff-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ff-h b{font-family:var(--f-display);font-stretch:85%;font-size:1.1rem}
.ff-h .muted{font-size:.82rem;flex:1;min-width:140px}
.led{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.led.ok{background:var(--ok);box-shadow:0 0 0 4px var(--ok-bg)}
.led.warn{background:var(--warn);box-shadow:0 0 0 4px var(--warn-bg)}
.led.bad{background:var(--bad);box-shadow:0 0 0 4px var(--bad-bg)}
.reclist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.reclist li{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.reclist li > div:first-child{display:flex;flex-direction:column;min-width:0}

/* Summary tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:560px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.tile b{display:block;font-family:var(--f-display);font-stretch:80%;font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums;font-weight:800}
.tile span{font-size:.75rem;color:var(--muted);font-weight:600}
.tile.hl{background:var(--tag);border-color:var(--tag);color:var(--tag-ink)}
.tile.hl span{color:var(--tag-ink)}

/* Lead cards */
.lead{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.lead.flash{animation:flash 1.6s ease-out 1}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--tag)}100%{box-shadow:0 0 0 0 transparent}}
.lead-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.lead-t{min-width:0}
.lead-t h3{font-size:1.45rem;font-weight:800;font-stretch:80%;line-height:1.05;overflow-wrap:anywhere}
.lead-t p{margin:3px 0 0;font-size:.86rem}
.pill{flex:none;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:.74rem;font-weight:700;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.pill.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.spin{width:11px;height:11px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.step{margin:0;font-size:.85rem;color:var(--info)}

.track{display:grid;grid-template-columns:repeat(6,1fr);gap:0;list-style:none;margin:0;padding:0}
.track li{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--f-mono);font-size:.62rem;color:var(--muted);text-align:center;letter-spacing:.02em}
.track li::before{content:"";position:absolute;top:6px;left:-50%;right:50%;height:2px;background:var(--line)}
.track li:first-child::before{display:none}
.track i{position:relative;z-index:1;width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--surface)}
.track li.done{color:var(--ink)}
.track li.done i{background:var(--accent);border-color:var(--accent)}
.track li.done::before{background:var(--accent)}
.track li.now i{border-color:var(--warn);background:var(--warn-bg)}
.track li.skip i{border-style:dashed}

.signed{display:flex;align-items:center;gap:8px;background:var(--tag);color:var(--tag-ink);font-weight:700;font-size:.82rem;padding:6px 10px;border-radius:6px;align-self:flex-start}
.signed::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--bg)}
.note{border-radius:10px;padding:10px 12px;font-size:.86rem;display:flex;flex-direction:column;gap:8px}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.bad{background:var(--bad-bg);color:var(--bad)}
.summary{margin:0;font-size:.92rem}

/* Facility Facts (Nutrition Facts vernacular) */
.facts{border:2px solid var(--ink);padding:6px 10px 8px;background:var(--surface);color:var(--ink);max-width:100%}
.facts-title{font-family:var(--f-display);font-weight:900;font-stretch:75%;font-size:2rem;line-height:1;letter-spacing:-.01em}
.facts-sub{font-size:.82rem;border-bottom:1px solid var(--ink);padding:2px 0 4px}
.bar{height:9px;background:var(--ink);margin:2px 0}
.bar.mid{height:5px}
.bar.thin{height:3px}
.frow{display:flex;justify-content:space-between;align-items:baseline;gap:14px;border-top:1px solid var(--ink);padding:4px 0;font-size:.88rem}
.frow > span{font-weight:800;white-space:nowrap}
.frow > b{font-weight:500;text-align:right;overflow-wrap:anywhere}
.frow.big > span,.frow.big > b{font-size:1.02rem}
.frow.big > b{font-weight:800}
.frow.col{flex-direction:column;align-items:stretch;gap:6px}
.frow.col > span small{font-weight:500;font-family:var(--f-mono);font-size:.68rem;color:var(--muted);margin-left:6px}
.big9{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.al{display:flex;justify-content:space-between;gap:4px;border:1px solid var(--line);border-radius:4px;padding:3px 6px;font-size:.74rem;text-transform:capitalize}
.al i{font-style:normal;font-family:var(--f-mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.03em}
.al.in{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.al.free{border-color:var(--ok);color:var(--ok)}
.al.na{color:var(--muted);border-style:dashed}
.facts-foot{margin:4px 0 0;font-size:.7rem;color:var(--muted)}
.facts.empty .frow > b{color:var(--muted);font-weight:500}

details.more{border-top:1px solid var(--line);padding-top:10px}
details.more summary{cursor:pointer;font-weight:600;font-size:.88rem;color:var(--accent)}
.more-body{display:flex;flex-direction:column;gap:12px;padding-top:12px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;font-size:.86rem;margin:0}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;overflow-wrap:anywhere}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs figure{margin:0;display:flex;flex-direction:column;gap:3px;font-size:.72rem;color:var(--muted)}
.thumbs img{width:120px;height:90px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#fff}

/* Thursday */
.when{display:flex;flex-direction:column;gap:2px}
.when b{font-family:var(--f-display);font-stretch:80%;font-size:1.6rem;font-weight:800;line-height:1.05}
.counts{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.fu{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.fu-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.fu-h > div{display:flex;flex-direction:column;min-width:0}
.fu-h b{font-family:var(--f-display);font-stretch:85%;font-size:1.15rem}
.fu-h .muted{font-size:.82rem;overflow-wrap:anywhere}

/* Timeline in setup */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.tl li{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:.88rem}
.tl li:first-child{border-top:none}
.tl .mono{color:var(--accent);font-weight:600}
.conn{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.conn li{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;padding:8px 0;border-top:1px solid var(--line)}
.conn li:first-child{border-top:none}

/* Empty */
.empty-state{text-align:center;padding:28px 16px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty-state h3{color:var(--ink);font-size:1.25rem}

/* Bottom tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabh)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:600;position:relative}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--accent)}
nav.tabs a[aria-current="page"]::after{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
nav.tabs .count{position:absolute;top:8px;left:calc(50% + 8px);background:var(--tag);color:var(--tag-ink);border-radius:999px;font-size:.62rem;font-weight:700;padding:0 5px;line-height:15px}

/* Sign-up sheet */
#sheet{position:fixed;inset:0;z-index:50;background:var(--band);color:var(--on-band);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#sheet .wrap{padding-block:22px 28px;display:flex;flex-direction:column;gap:16px;max-width:560px}
#sheet h2{font-size:2.1rem;font-weight:900;font-stretch:75%;line-height:1}
#sheet .pledge{font-size:1.05rem;line-height:1.5;margin:0}
#sheet label{color:var(--on-band);opacity:.85}
#sheet input{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:var(--on-band)}
#sheet .btn{border-color:rgba(255,255,255,.4);background:transparent;color:var(--on-band)}
#sheet .btn.primary{background:var(--tag);color:var(--tag-ink);border-color:var(--tag)}
.pad-wrap{position:relative;background:#FFFFFF;border-radius:10px;overflow:hidden}
.pad-wrap canvas{display:block;width:100%;height:190px;touch-action:none;cursor:crosshair}
.pad-wrap .x{position:absolute;left:16px;right:16px;bottom:38px;border-bottom:1.5px solid #9AA8A0;pointer-events:none}
.pad-wrap .x::before{content:"Sign here";position:absolute;left:0;top:6px;font-size:.72rem;color:#6B7A72;font-family:var(--f-mono)}
.tagcard{position:relative;align-self:center;width:min(100%,340px);background:var(--tag);color:var(--tag-ink);border-radius:6px;padding:22px 22px 18px 44px;box-shadow:0 14px 40px rgba(0,0,0,.3);transform:rotate(-2deg);display:flex;flex-direction:column;gap:6px}
.tagcard::before{content:"";position:absolute;left:14px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--band);box-shadow:inset 0 2px 3px rgba(0,0,0,.35)}
.tagcard small{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.05em;text-transform:uppercase}
.tagcard .no{font-family:var(--f-display);font-weight:900;font-stretch:75%;font-size:3.4rem;line-height:.9}
.tagcard .tt{font-family:var(--f-display);font-weight:800;font-stretch:85%;font-size:1.25rem}
.tagcard .co{font-weight:700;font-size:1.05rem;border-top:2px dashed rgba(43,34,0,.35);padding-top:8px;margin-top:4px;overflow-wrap:anywhere}
.tagcard img{height:56px;width:auto;mix-blend-mode:multiply;align-self:flex-start}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.tagcard{transform:none}}
</style>

<header class="top"><div class="wrap">
  <div class="brand"><span class="shelf" id="evtTag">PLMA</span><h1>Booth Copilot</h1></div>
  <div class="top-stats" id="topStats"></div>
</div></header>
<div class="wrap"><div id="banner"></div></div>
<main class="wrap" id="main" aria-live="polite"></main>
<div id="sheet" hidden></div>
<div id="toast" hidden role="status"></div>
<nav class="tabs" aria-label="Sections"><div class="wrap" id="tabs"></div></nav>

<script>
(() => {
"use strict";

/* ---------- constants & state ---------- */
const DEFAULTS = {

  autoSend: true,

};
const BIG9 = ["milk","eggs","fish","shellfish","tree nuts","peanuts","wheat","soy","sesame"];
const TAB = Math.random().toString(36).slice(2, 10);
const VIEWS = ["capture","suppliers","thursday","setup"];
const LS_KEY = "plma-booth-draft-v1";

function mcpMsg(e, server) {
  const c = e && e.code;
  if (c === "needs_reauth") return `Reconnect ${server} in claude.ai Settings → Connectors.`;
  if (c === "server_not_connected") return `Add the ${server} connector in claude.ai Settings → Connectors.`;
  if (c === "selection_required") return `Pick which ${server} account to use when claude.ai asks.`;
  if (c === "approval_required" || c === "not_in_manifest") return `${server} needs your OK for this page. Use "Allow" in Setup.`;
  if (c === "blocked_by_policy") return `${server} is blocked by your organization's policy.`;
  if (c === "server_unavailable") return `${server} didn't answer. Try again in a minute.`;

  if (c === "not_granted" || c === "capability_disabled") return `${server} isn't available in this view. Open the page in claude.ai, signed in.`;

}
function sampleMsg(e) {

}
async function safeUpdate(id, patch) {
  if (S.local[id]) S.local[id] = { ...S.local[id], ...patch };
  try { await S.cap.db.doc("leads/" + id).update({ ...patch, updatedAt: nowIso() }); } catch (e) { console.warn("update failed", e); }
}
async function prepImage(file, max = 1600, q = 0.85) {
  let src;
  try { src = await createImageBitmap(file, { imageOrientation: "from-image" }); }
  catch (e) { src = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); }); }
  const w = src.width, h = src.height, s = Math.min(1, max / Math.max(w, h));
  const c = document.createElement("canvas"); c.width = Math.round(w * s); c.height = Math.round(h * s);
  const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(src, 0, 0, c.width, c.height);
  return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("encode")), "image/jpeg", q));
}
function blobToB64(b) { return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1]); fr.onerror = () => rej(fr.error); fr.readAsDataURL(b); }); }
async function assetB64(id, max = 1280) {
  let blob = S.blobs[id];
  if (!blob) { const r = await fetch("/_blob/" + id); if (!r.ok) throw new Error("photo " + r.status); blob = await r.blob(); }
  let b64 = await blobToB64(await prepImage(blob, max, 0.8));
  if (b64.length > 850000) b64 = await blobToB64(await prepImage(blob, 900, 0.7));
  return b64;
}
function normAllergen(s) {
  const m = { soybeans: "soy", soybean: "soy", soya: "soy", egg: "eggs", "tree nut": "tree nuts", nuts: "tree nuts", peanut: "peanuts", dairy: "milk", "crustacean shellfish": "shellfish", crustaceans: "shellfish", crustacean: "shellfish", sesame: "sesame", gluten: "wheat" };
  const k = String(s || "").toLowerCase().trim(); return m[k] || k;
}

  const x = n(a), y = n(b); if (!x || !y) return true; return x.includes(y) || y.includes(x);

/* ---------- stages ---------- */
function stage(l) {
  const busy = S.busy.has(l.id);
  const f = l.followup || {};
  const stale = l.status === "processing" && !busy && Date.now() - Date.parse(l.updatedAt || l.createdAt) > 6 * 60000;
  if (l.status === "error" || stale) return { cls: "bad", text: stale ? "Interrupted" : "Needs attention" };
  if (busy || l.status === "processing") return { cls: "info", text: "Working" };
  if (l.status === "waiting") return { cls: "warn", text: "Waiting for Fireflies" };
  if (l.status === "transcribing") return { cls: "warn", text: "Fireflies transcribing" };
  if (f.status === "sent") return { cls: "ok", text: "Followed up" };
  if (l.matchWarning) return { cls: "warn", text: "Check recording" };
  if (!l.varun?.sentAt) return { cls: "warn", text: "Varun not emailed" };
  if (!l.previewUrl) return { cls: "info", text: "With Varun" };
  return { cls: "ok", text: "Preview ready" };
}
function tracker(l) {
  const f = l.followup || {};
  const steps = [
    ["Card", l.cardAssetId || l.email || l.company ? "done" : "skip"],
    ["Rec", l.noRecording ? "skip" : (l.fireflies?.id && l.details ? "done" : (l.status === "waiting" || l.status === "transcribing" ? "now" : (l.fireflies?.id ? "done" : "")))],
    ["Facts", l.details ? "done" : (S.busy.has(l.id) ? "now" : "")],
    ["Varun", l.varun?.sentAt ? "done" : (l.details ? "now" : "")],
    ["Preview", l.previewUrl ? "done" : (l.varun?.sentAt ? "now" : "")],
    ["Email", f.status === "sent" ? "done" : (f.status === "hold" ? "skip" : (l.previewUrl ? "now" : ""))]
  ];
  return `<ol class="track" aria-label="Progress">${steps.map(([n, s]) => `<li class="${s}"><i></i>${n}</li>`).join("")}</ol>`;
}
function fuState(l) {
  const f = l.followup || {};
  if (f.status === "sent") return ["sent", "Sent", "ok"];
  if (f.status === "hold") return ["hold", "On hold", ""];
  if (!validEmail(l.email)) return ["noemail", "No email", "bad"];
  if (!f.body) return ["nodraft", "Draft pending", "warn"];
  if (!l.previewUrl) return ["nopreview", "Needs preview link", "warn"];
  return ["ready", "Ready", "info"];
}

/* ---------- rendering ---------- */
function route() {
  const h = (location.hash || "").replace("#", "");
  S.view = VIEWS.includes(h) ? h : "capture";
  if (S.view === "setup") { S.sform = { ...S.settings }; S.sformDirty = false; }
  render(true);
}
function render(force) {
  const a = document.activeElement;
  if (!force && a && main.contains(a) && (a.tagName === "TEXTAREA" || (a.tagName === "INPUT" && a.type !== "file" && a.type !== "checkbox"))) { S.pendingRender = true; renderChrome(); return; }
  S.pendingRender = false;
  renderChrome();
  main.innerHTML = S.view === "suppliers" ? viewSuppliers() : S.view === "thursday" ? viewThursday() : S.view === "setup" ? viewSetup() : viewCapture();
  if (S.flash) { const el = document.getElementById("lead-" + S.flash); if (el) { el.classList.add("flash"); el.scrollIntoView({ block: "start", behavior: "smooth" }); } S.flash = null; }
}
function renderChrome() {
  const st = S.settings;
  $("#evtTag").textContent = st.eventName || "PLMA";
  const n = S.leads.length, signed = S.leads.filter(l => l.signature).length;

  if (!S.runtime) b = "Open this page from claude.ai to connect Fireflies, Gmail and the shared supplier list.";
  else if (S.booted && !S.cap.db) b = "Sign in to claude.ai to save suppliers. Nothing you capture here is stored until you do.";
  $("#banner").innerHTML = b ? `<div class="banner">${esc(b)}</div>` : "";
}

function ffPanel() {

  else if (st === "loading" || st === "idle") { line = "Connecting…"; }
  else if (st === "connect") { led = "warn"; line = "Needs your OK to read recordings"; extra = `<button class="btn primary sm" data-act="ffconnect">Connect Fireflies</button>`; }
  else if (st === "unavailable") { led = "bad"; line = "Not reachable from this view"; }

  const linked = new Set(S.leads.map(l => l.fireflies && l.fireflies.id).filter(Boolean));

/* ---------- Fireflies ---------- */
function recInput() { return { fromDate: S.settings.showStart || DEFAULTS.showStart, limit: 50, format: "json" }; }
function parseRecs(res) {
  let p = res && res.payload;
  if (typeof p === "string") { try { p = JSON.parse(p); } catch (e) { p = null; } }
  const list = Array.isArray(p) ? p : (p && (p.transcripts || p.data?.transcripts || p.results)) || [];
  return list.filter(x => x && x.id).map(x => ({
    id: String(x.id), title: x.title || "", start: x.dateString || (x.date ? new Date(Number(x.date) || x.date).toISOString() : ""),
    duration: Number(x.duration) || 0, link: x.meetingLink || null, status: x.meetingInfo?.summary_status || ""
  })).sort((a, b) => Date.parse(b.start) - Date.parse(a.start));
}
function watchRecs() {
  const mcp = S.cap.mcp; if (!mcp) { S.recState = "unavailable"; render(); return; }
  const input = recInput(); const key = JSON.stringify(input);
  if (S.unwatch && S.watchKey === key) return;
  if (S.unwatch) S.unwatch();
  S.watchKey = key;
  S.unwatch = mcp.watchTool("Fireflies", "fireflies_get_transcripts", input, ev => {
    if (ev.type === "data") onRecs(ev.result); else onRecErr(ev.error);
  }, { refetchInterval: 60000, cache: { staleTime: 30000, gcTime: 600000 } });
}
function connectFireflies() {
  const mcp = S.cap.mcp; if (!mcp) return;
  S.recState = "loading"; render();
  mcp.callTool("Fireflies", "fireflies_get_transcripts", recInput(), { cache: { staleTime: 0, gcTime: 600000, refresh: true } })
    .then(r => { onRecs(r); S.perm["mcp:Fireflies"] = "granted"; if (S.unwatch) { S.unwatch(); S.unwatch = null; } watchRecs(); })
    .catch(onRecErr);
}
function onRecs(result) {
  S.recs = parseRecs(result);
  S.recState = "ok"; S.recMsg = ""; S.recAt = result?.cache?.storedAt || Date.now();
  scheduleAuto();
  render();
}
function onRecErr(e) {
  const c = e && e.code;
  if (c === "approval_required" || c === "not_in_manifest") S.recState = "connect";
  else if (c === "not_granted" || c === "capability_disabled") S.recState = "unavailable";
  else { S.recState = S.recs.length ? "ok" : "error"; S.recMsg = mcpMsg(e, "Fireflies"); if (S.recs.length) toast(S.recMsg); }
  render();
}
async function claimRec(recId, leadId) {
  try {
    const ref = S.cap.db.doc("claims/" + recId);
    const a = await ref.acquire({ holder: TAB, ttlMs: 20000 });
    if (!a.acquired) return false;
    const s = await ref.get();
    const owner = s.exists ? s.data().leadId : null;
    if (owner && owner !== leadId) return false;
    await ref.set({ leadId, at: nowIso() });
    return true;
  } catch (e) { console.warn("claim", e); return true; }
}
let autoTimer = null;
function scheduleAuto() { clearTimeout(autoTimer); autoTimer = setTimeout(runAuto, 600); }
async function runAuto() {
  if (S.matching || !S.leadsLoaded || !S.cap.db || S.recState !== "ok") return;
  S.matching = true;
  try {
    const linked = new Set(S.leads.map(l => l.fireflies && l.fireflies.id).filter(Boolean));
    const dis = new Set(S.settings.dismissed || []);
    const free = S.recs.filter(r => isBooth(r) && !linked.has(r.id) && !dis.has(r.id));
    const mine = l => !l.createdBy || l.createdBy === S.myId;
    // 1) match waiting suppliers to recordings by time
    const waiting = S.leads.filter(l => l.status === "waiting" && !l.fireflies && !l.noRecording && mine(l) && !S.busy.has(l.id)).sort((a, b) => Date.parse(a.createdAt) - Date.parse(b.createdAt));
    for (const lead of waiting) {
      const t = Date.parse(lead.createdAt); const rej = new Set(lead.rejected || []);
      let best = null, bestD = Infinity;
      for (const r of free) {
        if (rej.has(r.id)) continue;
        const s = Date.parse(r.start); if (!s) continue;
        const e = s + r.duration * 60000;
        if (s < t - 120 * 60000 || s > t + 45 * 60000) continue;
        const dd = Math.min(Math.abs(s - t), Math.abs(e - t));
        if (dd < bestD) { bestD = dd; best = r; }
      }
      if (best && await claimRec(best.id, lead.id)) { free.splice(free.indexOf(best), 1); processLead(lead.id, best); }
    }
    // 2) recordings that never got a card become suppliers after 15 minutes
    if (S.settings.autoCreate) {
      const old = free.filter(r => { const s = Date.parse(r.start); return s && Date.now() - (s + r.duration * 60000) > 15 * 60000; }).slice(0, 3);
      for (const r of old) await leadFromRec(r.id, true);
    }
    // 3) retry recordings Fireflies was still transcribing
    for (const l of S.leads) {
      if (l.status === "transcribing" && mine(l) && !S.busy.has(l.id) && (l.attempts || 0) < 12 && Date.now() - Date.parse(l.lastTry || l.updatedAt || 0) > 90000) processLead(l.id, null);
    }
  } finally { S.matching = false; }
}
async function leadFromRec(recId, auto) {
  const r = S.recs.find(x => x.id === recId); if (!r || !S.cap.db) return;
  const id = newId();
  if (!(await claimRec(recId, id))) return;
  const end = new Date((Date.parse(r.start) || Date.now()) + r.duration * 60000).toISOString();
  const doc = { createdAt: end, updatedAt: nowIso(), createdBy: S.myId, source: auto ? "recording-auto" : "recording", company: "", contactName: "", title: "", email: "", phone: "", website: "", address: "", notes: "", interest: "", cardAssetId: null, selfieAssetId: null, signature: null, noRecording: false, status: "processing", step: "Reading the Fireflies transcript", followup: { status: "queued" } };
  S.local[id] = { id, ...doc };
  try { await S.cap.db.doc("leads/" + id).set(doc); } catch (e) { toast("Couldn't save the supplier: " + (e.code || "")); return; }
  processLead(id, r);
}

/* ---------- processing ---------- */
async function processLead(id, rec, opts = {}) {
  if (S.busy.has(id)) return;
  let lead = getLead(id); if (!lead) return;
  S.busy.add(id); render();
  const ref = S.cap.db.doc("leads/" + id);
  const up = async patch => { lead = { ...lead, ...patch }; if (S.local[id]) S.local[id] = lead; await ref.update({ ...patch, updatedAt: nowIso() }); };
  try {
    if (rec) await up({ fireflies: { id: rec.id, title: rec.title, start: rec.start, duration: rec.duration, renamed: false }, status: "processing", step: "Reading the Fireflies transcript", error: null });
    let transcript = "";
    if (lead.fireflies?.id) {
      await up({ status: "processing", step: "Reading the Fireflies transcript" });
      const r = await S.cap.mcp.callTool("Fireflies", "fireflies_get_transcript", { transcriptId: lead.fireflies.id }, { cache: false });
      transcript = transcriptText(r);
      if (transcript.replace(/\s+/g, "").length < 120) { await up({ status: "transcribing", step: "", attempts: (lead.attempts || 0) + 1, lastTry: nowIso() }); return; }
    }
    if (!S.cap.sample) throw { code: "not_granted", where: "sample" };
    await up({ step: "Pulling out MOQ, certifications and allergens" });
    const details = await extract(lead, transcript);
    const patch = { details, status: "extracted", step: "", error: null };
    if (!lead.company && details.company) patch.company = details.company;
    if (!lead.contactName && details.contactName) patch.contactName = details.contactName;
    if (!lead.title && details.contactTitle) patch.title = details.contactTitle;
    if (!lead.email && validEmail(details.email)) patch.email = details.email;
    patch.matchWarning = lead.company && details.company && !looseMatch(lead.company, details.company) ? details.company : null;
    const f = lead.followup || {};
    if (!f.edited && f.status !== "sent") patch.followup = { subject: details.followupSubject || `Great meeting you at ${S.settings.eventName}`, body: details.followupBody || "", status: f.status === "hold" ? "hold" : "queued" };
    await up(patch);
    if (lead.fireflies?.id && !lead.fireflies.renamed) {
      await up({ step: "Renaming the Fireflies recording" });
      const title = plmaTitle(lead);

function setupPad(c) {

  const ctx = c.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const reset = () => { ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, r.width, r.height); S.padInk = false; const b = $("#signBtn"); if (b) b.disabled = true; };
  reset(); S.padReset = reset;
  ctx.lineWidth = 2.6; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#13241D";
  let down = false, last = null;
  const pt = e => { const b = c.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; };
  c.addEventListener("pointerdown", e => { down = true; try { c.setPointerCapture(e.pointerId); } catch (x) {} last = pt(e); ctx.beginPath(); ctx.arc(last.x, last.y, 1.2, 0, Math.PI * 2); ctx.fillStyle = "#13241D"; ctx.fill(); e.preventDefault(); });
  c.addEventListener("pointermove", e => { if (!down) return; const p = pt(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; if (!S.padInk) { S.padInk = true; $("#signBtn").disabled = false; } e.preventDefault(); });
  const end = () => { down = false; };
  c.addEventListener("pointerup", end); c.addEventListener("pointercancel", end); c.addEventListener("pointerleave", end);
}

  let assetId = null;
  if (S.cap.assets && blob) { try { const r = await S.cap.assets.upload(blob, { type: "image/png" }); assetId = r.id; S.blobs[r.id] = blob; S.blobUrls[r.id] = URL.createObjectURL(blob); } catch (e) { toast("Signature saved on this screen only (" + (e.code || "error") + ")."); } }
  const sig = { assetId, name, company: co, signedAt: nowIso(), partnerNo: S.padNo, pledge: fill(S.settings.pledgeText, { company: co || S.draft.company }) };
  S.draft.signature = sig;
  if (name && !S.draft.contactName) S.draft.contactName = name;
  if (co && !S.draft.company) S.draft.company = co;
  saveDraft();
  const src = assetId ? imgSrc(assetId) : URL.createObjectURL(blob);
  $("#sheet").innerHTML = `<div class="wrap" style="align-items:center;text-align:center;padding-top:40px">
    <div class="tagcard" style="text-align:left">
      <small>${esc(S.settings.eventName)} · ${esc(S.settings.company)}</small>
      <div class="no">No. ${pad2(sig.partnerNo)}</div>
      <div class="tt">${esc(S.settings.pledgeTitle)}</div>
      <div class="co">${esc(co || "Your company")}</div>
      <img src="${esc(src)}" alt="Signature">
      <small>Signed by ${esc(name || "you")} · ${esc(fmtDate(sig.signedAt))}</small>
    </div>
    <p class="pledge" style="max-width:30ch">Thank you${name ? ", " + esc(firstName(name)) : ""}! We'll email you the details. Nothing else to read or sign.</p>
    <button class="btn primary big" data-act="sheetclose" style="max-width:360px">Done</button>
  </div>`;
}
function closeSheet() { $("#sheet").hidden = true; $("#sheet").innerHTML = ""; document.body.classList.remove("locked"); render(true); }

/* ---------- settings ---------- */
async function saveSettings(patch) {
  if (!S.cap.db) { toast("Sign in to claude.ai to save setup."); return false; }
  const next = { ...S.settings, ...patch };
  try {
    const ref = S.cap.db.doc("config/settings");
    if (S.settingsExists) await ref.update(patch); else await ref.set(next);
    S.settings = next; S.settingsExists = true; return true;
  } catch (e) { toast("Couldn't save setup (" + (e.code || "error") + ")."); return false; }
}

/* ---------- events ---------- */
function arm(key) { S.confirm[key] = true; render(true); setTimeout(() => { if (S.confirm[key]) { S.confirm[key] = false; render(); } }, 6000); }
const ACT = {
  save: () => saveLead(),
  cleardraft: () => { clearDraft(); render(true); },
  sign: () => openSign(),
  padclear: () => S.padReset && S.padReset(),
  padsign: () => signNow(),
  sheetclose: () => closeSheet(),
  interest: id => { S.draft.interest = S.draft.interest === id ? "" : id; saveDraft(); render(true); },
  filter: id => { S.filter = id; render(true); },
  ffconnect: () => connectFireflies(),
  ffrefresh: () => { if (S.cap.mcp) S.cap.mcp.invalidate("Fireflies", "fireflies_get_transcripts").catch(() => connectFireflies()); toast("Checking Fireflies…", 1800); },
  fromrec: id => leadFromRec(id, false),
  dismiss: async id => { await saveSettings({ dismissed: [...(S.settings.dismissed || []), id].slice(-300) }); render(true); },
  varun: id => notifyVarun(id),
  rerun: id => { const l = getLead(id); if (l) processLead(id, null, { noVarun: !!l.varun?.withDetails }); },
  norec: async id => { await safeUpdate(id, { noRecording: true, status: "processing" }); processLead(id, null); },
  dellead: async id => {
    if (!S.confirm["del" + id]) { arm("del" + id); return; }
    const l = getLead(id); if (!l) return;
    try { await S.cap.db.doc("leads/" + id).delete(); } catch (e) { toast("Couldn't delete (" + (e.code || "error") + ")."); return; }
    if (l.fireflies?.id) await saveSettings({ dismissed: [...(S.settings.dismissed || []), l.fireflies.id].slice(-300) });
    toast("Supplier deleted."); render(true);
  },
  confirmmatch: async id => { await safeUpdate(id, { matchWarning: null }); const l = getLead(id); if (l && !l.varun?.sentAt) notifyVarun(id, { ...l, matchWarning: null }); },
  unlink: async id => {
    const l = getLead(id); if (!l || !l.fireflies?.id) return;
    const rid = l.fireflies.id;
    try { await S.cap.db.doc("claims/" + rid).set({ leadId: null, at: nowIso() }); } catch (e) {}
    await safeUpdate(id, { fireflies: null, details: l.noRecording ? l.details : null, matchWarning: null, status: "waiting", rejected: [...(l.rejected || []), rid] });
    toast("Unlinked. The next matching recording will be used."); scheduleAuto();
  },
  savepv: async id => {
    const v = ($("#pv-" + CSS.escape(id)) || {}).value || "";
    const url = v.trim();
    if (url && !/^https?:\/\//i.test(url)) { toast("Paste a full link starting with https://"); return; }
    await safeUpdate(id, { previewUrl: url || null, previewFrom: "dashboard" }); toast(url ? "Preview link saved." : "Preview link cleared."); render(true);
  },
  photo: id => { if (!S.confirm["photo" + id]) { arm("photo" + id); return; } sendPhoto(id); },
  hold: async id => { const l = getLead(id); const f = l.followup || {}; await safeUpdate(id, { followup: { ...f, status: f.status === "hold" ? "queued" : "hold" } }); render(true); },
  sendfu: id => { if (!S.confirm["fu" + id]) { arm("fu" + id); return; } sendFollowup(id); },
  sendall: async () => {
    if (!S.confirm.sendall) { arm("sendall"); return; }
    S.confirm.sendall = false; S.sendingAll = true; render(true);
    const ready = S.leads.filter(l => fuState(l)[0] === "ready").map(l => l.id);
    for (const id of ready) { const l = getLead(id); if (l && fuState(l)[0] === "ready") await sendFollowup(id); }
    S.sendingAll = false; render(true); toast(`Done: ${ready.length} follow-up${ready.length === 1 ? "" : "s"} processed.`);
  },
  remindvarun: () => remindVarun(),
  allow: async () => {
    const p = S.cap.perms; if (!p) { toast("Permissions aren't available here. Each one asks on first use."); return; }
    const res = await p.request(["mcp:Fireflies", "mcp:Gmail", "sample"]).catch(() => ({}));
    Object.assign(S.perm, res);
    if (res["mcp:Fireflies"] === "granted") { if (S.unwatch) { S.unwatch(); S.unwatch = null; } watchRecs(); }
    render(true);
  },
  manage: async () => { try { await S.cap.perms.manage(); S.perm = await S.cap.perms.state().catch(() => S.perm); } catch (e) { toast("Open the page's Permissions menu in claude.ai."); } render(true); },
  heads: async () => {
    const st = S.settings;
    if (!validEmail(st.varunEmail)) { toast(`Add ${st.varunName}'s email and save setup first.`); return; }
    if (!S.cap.mcp) return;
    try {
      await S.cap.mcp.callTool("Gmail", "send_message", { to: [st.varunEmail.trim()], subject: `${st.eventName}: supplier details will come from this address`, body: `Hi ${st.varunName},\n\nI'm at ${st.eventName} this week. For every supplier I talk to, you'll get an email from this address with their MOQ, certifications, allergens and contact details, with the business card attached.\n\nPlease create their facility profile on the platform and reply to that email with the preview link by Wednesday. On Thursday morning the follow-up goes out to each supplier with you in CC. Anyone still without a preview comes back to you to send yourself.${st.dashboardUrl ? "\n\nDashboard with everything: " + st.dashboardUrl : ""}\n\nThanks!\n${st.myName}` });
      toast(`Heads-up sent to ${st.varunName}.`);
    } catch (e) { toast(mcpMsg(e, "Gmail"), 6000); }
  },
  savesettings: async () => {
    const f = { ...S.sform };
    if (f.varunEmail && !validEmail(f.varunEmail)) { toast("That email doesn't look right."); return; }
    const before = S.settings.showStart;
    const ok = await saveSettings(f);
    if (ok) { S.sformDirty = false; toast("Setup saved."); if (f.showStart !== before) watchRecs(); render(true); }
  }
};
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const fn = ACT[b.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(b.dataset.id, b);
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.f) { S.draft[el.dataset.f] = el.value; saveDraft(); }
  else if (el.dataset.s && S.sform) { S.sform[el.dataset.s] = el.value; S.sformDirty = true; }
});
document.addEventListener("change", async e => {
  const el = e.target;
  if (el.dataset.pick) { const file = el.files && el.files[0]; el.value = ""; onPick(el.dataset.pick, file); return; }
  if (el.dataset.fcheck) { S.draft[el.dataset.fcheck] = el.checked; saveDraft(); return; }
  if (el.dataset.sf && S.sform) { S.sform[el.dataset.sf] = el.checked; S.sformDirty = true; return; }
  if (el.dataset.scheck) { await saveSettings({ [el.dataset.scheck]: el.checked }); toast(el.checked ? "Thursday emails will go out automatically." : "Thursday emails are paused. Use Send now instead."); render(true); return; }
  if (el.dataset.lead && el.dataset.lf) { const k = el.dataset.lf; let v = el.value.trim(); if (k === "email") v = v.toLowerCase(); await safeUpdate(el.dataset.lead, { [k]: v }); return; }
  if (el.dataset.lead && el.dataset.fu) { const l = getLead(el.dataset.lead); if (!l) return; await safeUpdate(l.id, { followup: { ...(l.followup || {}), [el.dataset.fu]: el.value, edited: true } }); return; }
});
document.addEventListener("focusout", () => { setTimeout(() => { if (S.pendingRender) render(); }, 80); });

/* ---------- boot ---------- */
async function boot() {
  route();
  window.addEventListener("hashchange", route);
  const c = window.claude;
  if (!c || !c.use) { S.runtime = false; S.recState = "unavailable"; render(true); return; }
  const names = ["db", "mcp", "sample", "assets", "user", "permissions"];
  const got = await Promise.all(names.map(n => c.use(n).catch(() => null)));
  const [db, mcp, sample, assets, user, perms] = got;
  S.cap = { db, mcp, sample, assets, user, perms };
  S.booted = true;
  if (user) S.myId = await user.id().catch(() => null);
  if (sample) { const lim = await sample.limits().catch(() => null); S.canImages = !!(lim && lim.images); }
  if (perms) S.perm = await perms.state().catch(() => ({})) || {};
  if (db) {
    const slow = setTimeout(() => { S.loadSlow = true; render(); }, 10000);
    db.doc("config/settings").onSnapshot(s => {
      const before = S.settings.showStart;
      S.settings = { ...DEFAULTS, ...(s.exists ? s.data() : {}) }; S.settingsExists = s.exists; S.settingsLoaded = true;
      if (S.view === "setup" && !S.sformDirty) S.sform = { ...S.settings };
      if (before !== S.settings.showStart && S.unwatch) watchRecs();
      render();
    }, e => console.warn("settings", e));
    db.collection("leads").onSnapshot(snap => {
      clearTimeout(slow); S.loadSlow = false;
      S.leads = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => Date.parse(b.createdAt) - Date.parse(a.createdAt));
      for (const l of S.leads) if (S.local[l.id]) delete S.local[l.id];
      S.leadsLoaded = true; scheduleAuto(); render();
    }, e => { clearTimeout(slow); toast("The supplier list stopped updating (" + (e.code || "error") + "). Reload the page."); });
  }
  if (!mcp) { S.recState = "unavailable"; render(true); return; }
  const ff = S.perm["mcp:Fireflies"];
  if (ff === "denied") { S.recState = "error"; S.recMsg = "Fireflies is turned off for this page. Turn it on under Setup → Permissions."; }
  else if (ff === "prompt") S.recState = "connect";
  else watchRecs();
  // One batched ask up front so nothing pops up mid-conversation.
  const ask = ["mcp:Fireflies", "mcp:Gmail", "sample"].filter(k => S.perm[k] === "prompt");
  if (perms && ask.length) {
    perms.request(ask).then(res => { Object.assign(S.perm, res); if (res["mcp:Fireflies"] === "granted") watchRecs(); render(); }).catch(() => {});
  }
  render();
}
boot();
})();
</script>
